<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ඡන්ද විමසුම</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;700&family=Fraunces:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#F3F6F4;--card:#fff;--ink:#12302B;--soft:#5B7570;--line:#D5E0DC;--main:#0E7C66;--main2:#0A5E4D;--warn:#C2412D;--tint:#E3F1ED}
@media(prefers-color-scheme:dark){:root{--bg:#0E1A18;--card:#152522;--ink:#E6F2EF;--soft:#8FAAA4;--line:#27403B;--main:#2FBF9F;--main2:#4FD6B8;--warn:#F0735F;--tint:#1B3530}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 'Noto Sans Sinhala',system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 80px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0 20px}
h1{margin:0;font:800 1.6rem 'Fraunces','Noto Sans Sinhala',serif}
nav{display:flex;background:var(--tint);border-radius:999px;padding:4px}
nav button{border:0;background:none;color:var(--soft);font:inherit;font-size:.9rem;padding:6px 16px;border-radius:999px;cursor:pointer}
nav button.on{background:var(--main);color:#fff;font-weight:500}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:18px}
h2{margin:0 0 4px;font:600 1.3rem 'Fraunces','Noto Sans Sinhala',serif}
.m{color:var(--soft);font-size:.85rem;margin:0}
.q{padding:18px 0;border-top:1px solid var(--line)}
.q b{display:block;margin-bottom:2px}
.opt{display:flex;gap:12px;align-items:center;padding:11px 14px;margin-top:8px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer}
.opt:has(input:checked){border-color:var(--main);background:var(--tint)}
.opt input{accent-color:var(--main);width:18px;height:18px;margin:0}
.btn{background:var(--main);color:#fff;border:0;border-radius:10px;padding:12px 22px;font:500 .95rem inherit;font-family:inherit;cursor:pointer}
.btn:hover{background:var(--main2)}.btn:disabled{opacity:.5;cursor:wait}
.sm{background:none;border:1.5px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;font-size:.82rem;cursor:pointer}
.sm:hover{border-color:var(--main)}.sm.red{color:var(--warn);border-color:var(--warn)}
input[type=text],input[type=email],input[type=password]{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin:4px 0 10px}
input:focus-visible,button:focus-visible{outline:2px solid var(--main);outline-offset:2px}
.err{color:var(--warn);font-size:.85rem;margin-top:8px}
.done{text-align:center;padding:48px 16px}
.tick{width:72px;height:72px;border-radius:50%;background:var(--main);color:#fff;font-size:2.2rem;line-height:72px;margin:0 auto 14px}
.tabs{display:flex;gap:6px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.tabs .sm.on{background:var(--main);color:#fff;border-color:var(--main)}
.bar{margin-top:12px}.bar div:first-child{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.tr{height:10px;background:var(--tint);border-radius:5px;overflow:hidden}.tr i{display:block;height:100%;background:var(--main)}
.box{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center}
.x{background:none;border:0;color:var(--warn);font-size:1.1rem;cursor:pointer}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.danger{border:1.5px solid var(--warn);border-radius:12px;padding:16px;margin-top:20px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:.88rem;display:none;z-index:9}
</style>
</head>
<body>
<div class="wrap">
<header><h1>ඡන්ද විමසුම</h1>
<nav><button id="tv" class="on" onclick="tab('vote')">ඡන්දය දෙන්න</button><button id="ta" onclick="tab('admin')">පරිපාලක</button></nav></header>

<section id="vv" class="view on"></section>

<section id="av" class="view">
<div id="login" class="card" style="max-width:380px;margin:30px auto">
<h2>පරිපාලක පිවිසුම</h2><p class="m" style="margin-bottom:12px">Email සහ මුරපදය ඇතුළත් කරන්න</p>
<input type="email" id="em" placeholder="Email" autocomplete="username">
<input type="password" id="pw" placeholder="මුරපදය" autocomplete="current-password">
<button class="btn" id="lb" style="width:100%" onclick="login()">පිවිසෙන්න</button><div id="le" class="err"></div>
</div>
<div id="panel" style="display:none">
<div class="tabs"><button class="sm on" id="t1" onclick="atab('r')">ප්‍රතිඵල</button><button class="sm" id="t2" onclick="atab('c')">නව විමසුමක්</button><button class="sm" style="margin-left:auto" onclick="logout()">පිටවීම</button></div>
<div id="res"></div><div id="cre" style="display:none"></div>
</div>
</section>
</div>
<div id="toast"></div>

<script>
const sb=supabase.createClient("https://jcijglwpkfluyzrltimk.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjaWpnbHdwa2ZsdXl6cmx0aW1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4MzU3OTUsImV4cCI6MjA4MjQxMTc5NX0.dvT8OiyVEiYn_DhkMakmSq1Vvr4REDr0kYPnyqCtWHs");
const $=i=>document.getElementById(i),ZERO='00000000-0000-0000-0000-000000000000';
const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
const escA=s=>esc(s).replace(/"/g,'&quot;');
function toast(m,e){const t=$('toast');t.textContent=m;t.style.background=e?'#C2412D':'';t.style.color=e?'#fff':'';t.style.display='block';setTimeout(()=>t.style.display='none',3200)}
function token(){let t=localStorage.getItem('poll_voter_token');if(!t){t=crypto.randomUUID();localStorage.setItem('poll_voter_token',t)}return t}
let timer=null;const stopT=()=>{clearInterval(timer);timer=null};

function tab(t){
  $('vv').classList.toggle('on',t==='vote');$('av').classList.toggle('on',t==='admin');
  $('tv').classList.toggle('on',t==='vote');$('ta').classList.toggle('on',t==='admin');
  if(t==='vote'){stopT();loadVote()}else checkAdmin();
}
async function fetchPoll(activeOnly){
  let q=sb.from('polls').select('id,title,is_active,created_at').order('created_at',{ascending:false}).limit(1);
  if(activeOnly)q=q.eq('is_active',true);
  const{data:p,error}=await q;if(error)throw error;if(!p.length)return null;
  const poll=p[0];
  const{data:qs,error:e2}=await sb.from('questions').select('id,question_text,allow_multiple,position').eq('poll_id',poll.id).order('position');if(e2)throw e2;
  const ids=qs.length?qs.map(x=>x.id):[ZERO];
  const{data:os,error:e3}=await sb.from('options').select('id,question_id,option_text,position').in('question_id',ids).order('position');if(e3)throw e3;
  return{poll,qs,os,ids};
}

/* ---- vote ---- */
async function loadVote(){
  const el=$('vv');el.innerHTML='<p class="m" style="text-align:center;padding:40px">පූරණය වෙමින්...</p>';
  let d;try{d=await fetchPoll(true)}catch(e){el.innerHTML=`<div class="card"><h2>දෝෂයක්</h2><p class="err">${esc(e.message)}</p></div>`;return}
  if(!d){el.innerHTML='<div class="card done"><h2>දැනට ක්‍රියාත්මක විමසුමක් නැත</h2><p class="m">පරිපාලකවරයා නව විමසුමක් පළ කරන තෙක් රැඳී සිටින්න.</p></div>';return}
  const{poll,qs,os}=d;
  if(localStorage.getItem('voted_'+poll.id)==='true'){
    el.innerHTML=`<div class="card done"><div class="tick">✓</div><h2>ඡන්දය සටහන් විය</h2><p class="m">"${esc(poll.title)}" සඳහා ඔබ දැනටමත් ඡන්දය දී ඇත. ස්තුතියි!</p></div>`;return}
  let h=`<form class="card" id="f"><h2>${esc(poll.title)}</h2><p class="m" style="margin-bottom:10px">සියලුම ප්‍රශ්නවලට පිළිතුරු දී පහළින් ඉදිරිපත් කරන්න.</p>`;
  qs.forEach((q,i)=>{
    const t=q.allow_multiple?'checkbox':'radio';
    h+=`<div class="q"><b>${i+1}. ${esc(q.question_text)}</b><span class="m">${q.allow_multiple?'එකකට වඩා තෝරාගත හැක':'එකක් පමණක් තෝරන්න'}</span>`;
    os.filter(o=>o.question_id===q.id).forEach(o=>h+=`<label class="opt"><input type="${t}" name="q_${q.id}" value="${o.id}"><span>${esc(o.option_text)}</span></label>`);
    h+='</div>';
  });
  h+='<button class="btn" id="cast" style="margin-top:14px">ඡන්දය සටහන් කරන්න</button><div id="ve" class="err"></div></form>';
  el.innerHTML=h;
  $('f').addEventListener('submit',e=>{e.preventDefault();submitVote(poll,qs)});
}
async function submitVote(poll,qs){
  const err=$('ve'),btn=$('cast');err.textContent='';const rows=[];
  for(const q of qs){
    const c=document.querySelectorAll(`input[name="q_${q.id}"]:checked`);
    if(!c.length){err.textContent='කරුණාකර සියලුම ප්‍රශ්නවලට පිළිතුරු දෙන්න.';return}
    c.forEach(x=>rows.push({question_id:q.id,option_id:x.value,voter_token:token()}));
  }
  btn.disabled=true;
  const{error}=await sb.from('votes').insert(rows);
  if(error){err.textContent='දෝෂයක්: '+error.message;btn.disabled=false;return}
  localStorage.setItem('voted_'+poll.id,'true');loadVote();toast('ඔබේ ඡන්දය සටහන් විය. ස්තුතියි!');
}

/* ---- admin auth ---- */
function show(on){$('login').style.display=on?'none':'block';$('panel').style.display=on?'block':'none'}
async function isAdmin(uid){const{data,error}=await sb.from('admins').select('user_id').eq('user_id',uid).maybeSingle();return !error&&!!data}
async function checkAdmin(){
  const{data:{session}}=await sb.auth.getSession();
  if(session&&await isAdmin(session.user.id)){show(true);atab('r')}else{stopT();show(false)}
}
async function login(){
  const email=$('em').value.trim(),pass=$('pw').value,err=$('le'),b=$('lb');err.textContent='';
  if(!email||!pass){err.textContent='Email සහ මුරපදය දෙකම ඇතුළත් කරන්න.';return}
  b.disabled=true;
  const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
  b.disabled=false;
  if(error){err.textContent='පිවිසීම අසාර්ථකයි: '+error.message;return}
  if(!(await isAdmin(data.user.id))){await sb.auth.signOut();err.textContent='මෙම ගිණුමට පරිපාලක අවසරය නැත.';return}
  $('pw').value='';checkAdmin();
}
async function logout(){await sb.auth.signOut();stopT();show(false)}
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'){stopT();show(false)}});
['em','pw'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')login()}));

function atab(t){
  $('t1').classList.toggle('on',t==='r');$('t2').classList.toggle('on',t==='c');
  $('res').style.display=t==='r'?'block':'none';$('cre').style.display=t==='c'?'block':'none';
  stopT();
  if(t==='r'){loadResults();timer=setInterval(loadResults,30*60*1000)}else initBuilder();
}

/* ---- results ---- */
async function fetchVotes(ids){
  let all=[],from=0;
  while(true){
    const{data,error}=await sb.from('votes').select('id,question_id,option_id,voter_token').in('question_id',ids).range(from,from+999);
    if(error)throw error;all=all.concat(data);if(data.length<1000)break;from+=1000;
  }
  return all;
}
async function loadResults(){
  const el=$('res');el.innerHTML='<p class="m">පූරණය වෙමින්...</p>';
  let d,votes;
  try{d=await fetchPoll(false);if(d)votes=await fetchVotes(d.ids)}catch(e){el.innerHTML=`<p class="err">${esc(e.message)}</p>`;return}
  if(!d){el.innerHTML='<div class="card"><p class="m">තවම විමසුමක් සාදා නොමැත.</p></div>';return}
  const{poll,qs,os}=d,total=new Set(votes.map(v=>v.voter_token)).size;
  const rd={title:poll.title,active:poll.is_active,total,qs:[]};
  let h=`<div class="tools"><button class="sm" onclick="window.print()">මුද්‍රණය / PDF</button><button class="sm" onclick="exportXLSX()">Excel බාගත කරන්න</button></div>
  <div class="card"><h2>${esc(poll.title)}</h2><p class="m">මුළු ප්‍රතිචාර දක්වූවන්: <b>${total}</b> · ${poll.is_active?'ක්‍රියාත්මකයි':'අක්‍රියයි'}</p>`;
  qs.forEach((q,i)=>{
    const qv=votes.filter(v=>v.question_id===q.id),qr=new Set(qv.map(v=>v.voter_token)).size,den=qr||1;
    const opts=os.filter(o=>o.question_id===q.id).map(o=>({...o,c:qv.filter(v=>v.option_id===o.id).length})).sort((a,b)=>b.c-a.c);
    const r={text:q.question_text,n:qr,o:[]};
    h+=`<div class="q"><b>${i+1}. ${esc(q.question_text)}${q.allow_multiple?' <span class="m">(බහුවරණ)</span>':''}</b><span class="m">පිළිතුරු දුන් සංඛ්‍යාව: ${qr}</span>`;
    opts.forEach(o=>{
      const p=Math.round(o.c/den*100),ac=Math.max(den-o.c,0);
      r.o.push([o.option_text,o.c,p+'%',ac,(100-p)+'%']);
      h+=`<div class="bar"><div><span>${esc(o.option_text)}</span><span>+${o.c} (${p}%) &nbsp;−${ac} (${100-p}%)</span></div><div class="tr"><i style="width:${p}%"></i></div></div>`;
    });
    rd.qs.push(r);h+='</div>';
  });
  h+=`</div><div class="danger"><b style="color:var(--warn)">අවදානම් කලාපය</b><p class="m" style="margin:4px 0 10px">වත්මන් විමසුම සහ සියලුම ඡන්ද ස්ථිරවම මැකේ.</p><button class="sm red" onclick="resetAll()">සියලු දත්ත මකන්න</button></div>`;
  el.innerHTML=h;window._rd=rd;
}
function exportXLSX(){
  const d=window._rd;if(!d||!window.XLSX){toast('Excel library එක load වී නැත.',true);return}
  const r=[['මාතෘකාව',d.title],['ස්ථිතිය',d.active?'ක්‍රියාත්මකයි':'අක්‍රියයි'],['මුළු ප්‍රතිචාර දක්වූවන්',d.total],[]];
  d.qs.forEach((q,i)=>{r.push([`${i+1}. ${q.text}`],['විකල්පය','ඡන්ද (+)','% (+)','ඡන්ද (−)','% (−)'],...q.o,[])});
  const ws=XLSX.utils.aoa_to_sheet(r);ws['!cols']=[{wch:40},{wch:12},{wch:10},{wch:12},{wch:10}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Results');XLSX.writeFile(wb,'poll-results.xlsx');
}
async function wipe(){
  const{data}=await sb.from('polls').select('id');
  if(data&&data.length){const{error}=await sb.from('polls').delete().in('id',data.map(p=>p.id));if(error)throw error}
}
async function resetAll(){
  if(!confirm('සියලුම විමසුම් සහ ඡන්ද ස්ථිරවම මකා දමන්නද?'))return;
  try{await wipe();toast('සියලු දත්ත මකා දමන ලදී.');loadResults()}catch(e){toast('දෝෂයක්: '+e.message,true)}
}

/* ---- create poll ---- */
let bq=[],kc=0,draft='';
const gq=k=>bq.find(q=>q.k===k);
function initBuilder(){if(!bq.length)addQ();else draw()}
function addQ(){kc++;bq.push({k:kc,text:'',multi:false,o:[{k:1,text:''},{k:2,text:''}]});draw()}
function delQ(k){bq=bq.filter(q=>q.k!==k);draw()}
function addO(k){const q=gq(k);q.o.push({k:Math.max(0,...q.o.map(o=>o.k))+1,text:''});draw()}
function delO(k,o){const q=gq(k);if(q.o.length>2){q.o=q.o.filter(x=>x.k!==o);draw()}}
function draw(){
  $('cre').innerHTML=`<div class="card"><h2>නව විමසුමක් සාදන්න</h2>
  <p class="m" style="margin-bottom:14px">ප්‍රකාශයට පත් කිරීමේදී පැරණි විමසුම සහ එහි ඡන්ද ස්ථිරවම මැකේ.</p>
  <label class="m">විමසුමේ මාතෘකාව</label><input type="text" id="pt" placeholder="උදා: 2026 වාර්ෂික සමීක්ෂණය">
  <div id="qbs"></div><button class="sm" onclick="addQ()">+ ප්‍රශ්නයක්</button>
  <div style="margin-top:20px"><button class="btn" id="pub" onclick="publish()">පැරණි දත්ත මකා ප්‍රකාශයට පත් කරන්න</button></div><div id="pe" class="err"></div></div>`;
  const t=$('pt');t.value=draft;t.oninput=e=>draft=e.target.value;
  $('qbs').innerHTML=bq.map((q,i)=>`<div class="box"><div class="row"><input type="text" value="${escA(q.text)}" placeholder="ප්‍රශ්නය ${i+1}" oninput="gq(${q.k}).text=this.value">${bq.length>1?`<button class="x" onclick="delQ(${q.k})">✕</button>`:''}</div>
  ${q.o.map(o=>`<div class="row"><input type="text" value="${escA(o.text)}" placeholder="විකල්පය" oninput="gq(${q.k}).o.find(x=>x.k==${o.k}).text=this.value">${q.o.length>2?`<button class="x" onclick="delO(${q.k},${o.k})">✕</button>`:''}</div>`).join('')}
  <button class="sm" onclick="addO(${q.k})">+ විකල්පයක්</button>
  <label class="row m" style="margin-top:10px"><input type="checkbox" ${q.multi?'checked':''} onchange="gq(${q.k}).multi=this.checked"> බහුවරණ තේරීමට අවසර දෙන්න</label></div>`).join('');
}
async function publish(){
  const err=$('pe');err.textContent='';const title=draft.trim();
  if(!title){err.textContent='විමසුමේ මාතෘකාව අවශ්‍යයි.';return}
  for(const q of bq){
    if(!q.text.trim()){err.textContent='සියලුම ප්‍රශ්නවලට පෙළ අවශ්‍යයි.';return}
    if(q.o.some(o=>!o.text.trim())){err.textContent='සියලුම විකල්පවලට පෙළ අවශ්‍යයි.';return}
  }
  if(!confirm('පැරණි විමසුම සහ ඡන්ද ස්ථිරවම මකා, නව විමසුම ප්‍රකාශයට පත් කරන්නද?'))return;
  const b=$('pub'),l=b.textContent;b.disabled=true;b.textContent='සකසමින්...';
  try{
    await wipe();
    const{data:p,error:pe}=await sb.from('polls').insert({title,is_active:true}).select().single();if(pe)throw pe;
    for(let i=0;i<bq.length;i++){
      const q=bq[i];
      const{data:nq,error:qe}=await sb.from('questions').insert({poll_id:p.id,question_text:q.text.trim(),allow_multiple:q.multi,position:i}).select().single();if(qe)throw qe;
      const{error:oe}=await sb.from('options').insert(q.o.map((o,j)=>({question_id:nq.id,option_text:o.text.trim(),position:j})));if(oe)throw oe;
    }
    bq=[];draft='';toast('නව විමසුම ප්‍රකාශයට පත් කරන ලදී.');atab('r');
  }catch(e){err.textContent='දෝෂයක්: '+e.message}
  finally{b.disabled=false;b.textContent=l}
}
loadVote();
</script>
</body>
</html>
